<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lecturas sincronizadas de los sensores</title>
  <desc id="desc">Tres bandas de cero a sesenta segundos. H-1 y H-2 tienen pulsos en cero y cuarenta segundos; el sismómetro solo presenta ruido basal.</desc>
  <rect width="1600" height="1000" rx="36" fill="#071722"/>
  <text x="110" y="105" fill="#f2fbff" font-family="system-ui, sans-serif" font-size="48" font-weight="700">REGISTRO SINCRONIZADO · 0–60 s</text>
  <g font-family="ui-monospace, monospace" font-size="29" fill="#d9edf4">
    <text x="110" y="283">Hidrófono H-1</text>
    <text x="110" y="533">Hidrófono H-2</text>
    <text x="110" y="783">Sismómetro</text>
  </g>
  <g stroke="#345160" stroke-width="2">
    <path d="M390 170H1490M390 420H1490M390 670H1490M390 920H1490"/>
    <path d="M390 170V920M757 170V920M1123 170V920M1490 170V920" stroke-dasharray="8 10"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="25" fill="#a8c1cb" text-anchor="middle">
    <text x="390" y="962">0 s</text><text x="757" y="962">20 s</text><text x="1123" y="962">40 s</text><text x="1490" y="962">60 s</text>
  </g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M390 310l18-78 17 156 18-78h630l22-82 22 164 22-82h371" stroke="#72e6ff" stroke-width="10"/>
    <path d="M390 560l19-70 18 140 19-70h627l22-76 22 152 22-76h371" stroke="#ffd166" stroke-width="10"/>
    <path d="M390 810l44-5 45 8 44-10 45 6 44-2 45 7 44-12 45 9 44-4 45 6 44-8 45 4 44-5 45 8 44-7 45 3 44-4 45 6 44-8 45 7 44-3 45 4 44-6 45 4" stroke="#e3a8ff" stroke-width="7"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">
    <g fill="#071722" stroke="#72e6ff" stroke-width="4"><rect x="352" y="180" width="76" height="42" rx="21"/><rect x="1085" y="180" width="76" height="42" rx="21"/></g>
    <text x="390" y="210" fill="#dffaff">0 s</text><text x="1123" y="210" fill="#dffaff">40 s</text>
    <g fill="#071722" stroke="#ffd166" stroke-width="4"><rect x="352" y="430" width="76" height="42" rx="21"/><rect x="1085" y="430" width="76" height="42" rx="21"/></g>
    <text x="390" y="460" fill="#fff2c2">0 s</text><text x="1123" y="460" fill="#fff2c2">40 s</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="23" fill="#c7dce4">
    <circle cx="112" cy="885" r="9" fill="#e3a8ff"/><text x="135" y="893">Ruido basal · sin pico coincidente</text>
  </g>
</svg>
