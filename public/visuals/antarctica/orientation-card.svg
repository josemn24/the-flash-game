<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tarjeta de orientación: brújula a 090 grados y corrección de menos 30 grados</title>
  <desc id="desc">Una brújula señala 090 grados. La tarjeta indica rumbo de mapa igual a lectura de brújula menos 30 grados y ofrece los rumbos 060, 090, 120 y 270 grados.</desc>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a3b"/>
      <stop offset="1" stop-color="#07141e"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#c9f6ff" stroke-opacity=".1" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <path d="M2 2l12 6-12 6z" fill="#f7c95c" stroke="#07141e" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" rx="56" fill="url(#ice)"/>
  <rect x="26" y="26" width="1548" height="948" rx="42" fill="url(#grid)" stroke="#bcebf4" stroke-width="4"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#f4fbfc">
    <text x="90" y="105" font-size="34" font-weight="800" letter-spacing="7">TARJETA DE ORIENTACIÓN</text>
    <text x="90" y="158" font-size="27" fill="#b9d8df">Lectura del equipo de campo</text>
  </g>

  <g transform="translate(390 555)">
    <circle r="300" fill="#0a1d29" stroke="#d8f3f7" stroke-width="8"/>
    <circle r="250" fill="none" stroke="#8eb7c0" stroke-width="3" stroke-dasharray="8 14"/>
    <g stroke="#d8f3f7" stroke-width="6">
      <path d="M0-300v44M300 0h-44M0 300v-44M-300 0h44"/>
    </g>
    <g fill="#d8f3f7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="900" text-anchor="middle">
      <text y="-205">N · 000°</text>
      <text x="205" y="13">E</text>
      <text y="235">S · 180°</text>
      <text x="-205" y="13">O</text>
    </g>
    <path d="M-16 105L0-220l16 325z" fill="#d8f3f7" stroke="#07141e" stroke-width="5" transform="rotate(90)"/>
    <path d="M0 0H225" stroke="#f7c95c" stroke-width="18" marker-end="url(#arrow)"/>
    <circle r="25" fill="#f7c95c" stroke="#07141e" stroke-width="7"/>
    <text x="0" y="-345" fill="#f7c95c" font-family="ui-monospace, monospace" font-size="50" font-weight="900" text-anchor="middle">LECTURA: 090°</text>
  </g>

  <g transform="translate(780 230)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="720" height="270" rx="30" fill="#edf9fa" stroke="#07141e" stroke-width="5"/>
    <text x="48" y="70" fill="#174456" font-size="28" font-weight="850" letter-spacing="3">CORRECCIÓN DE LA MISIÓN</text>
    <text x="360" y="155" fill="#07141e" font-family="ui-monospace, monospace" font-size="48" font-weight="900" text-anchor="middle">RUMBO DE MAPA</text>
    <text x="360" y="218" fill="#07141e" font-family="ui-monospace, monospace" font-size="48" font-weight="900" text-anchor="middle">= LECTURA − 30°</text>
  </g>

  <g transform="translate(780 560)" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" fill="#b9d8df" font-size="27" font-weight="750">RUMBOS DISPONIBLES</text>
    <g transform="translate(0 35)" font-family="ui-monospace, monospace" font-size="38" font-weight="900" text-anchor="middle">
      <g><rect width="330" height="110" rx="22" fill="none" stroke="#f4fbfc" stroke-width="4"/><text x="165" y="70" fill="#f4fbfc">060°</text></g>
      <g transform="translate(370 0)"><rect width="330" height="110" rx="22" fill="none" stroke="#f4fbfc" stroke-width="4" stroke-dasharray="16 10"/><text x="165" y="70" fill="#f4fbfc">090°</text></g>
      <g transform="translate(0 145)"><rect width="330" height="110" rx="22" fill="none" stroke="#f4fbfc" stroke-width="4"/><text x="165" y="70" fill="#f4fbfc">120°</text></g>
      <g transform="translate(370 145)"><rect width="330" height="110" rx="22" fill="none" stroke="#f4fbfc" stroke-width="4" stroke-dasharray="16 10"/><text x="165" y="70" fill="#f4fbfc">270°</text></g>
    </g>
  </g>
</svg>
