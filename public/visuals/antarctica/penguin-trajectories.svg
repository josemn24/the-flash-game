<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de trayectorias A, B, C y D</title>
  <desc id="desc">Mapa con norte arriba, interior a la izquierda y mar a la derecha. La colonia está en C4. Las rutas A, B y C parten de C4; la ruta D parte de B4. Cada destino está marcado con la letra de su ruta.</desc>
  <defs>
    <pattern id="sea" width="32" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9c8-8 16-8 24 0s16 8 24 0" fill="none" stroke="#78d7ea" stroke-width="4"/>
    </pattern>
    <marker id="arrowA" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="30" refY="17" orient="auto"><path d="M0 0l34 17-34 17Z" fill="#f4cb6b"/></marker>
    <marker id="arrowB" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="30" refY="17" orient="auto"><path d="M0 0l34 17-34 17Z" fill="#7de2ff"/></marker>
    <marker id="arrowC" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="30" refY="17" orient="auto"><path d="M0 0l34 17-34 17Z" fill="#e4a7ff"/></marker>
    <marker id="arrowD" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="30" refY="17" orient="auto"><path d="M0 0l34 17-34 17Z" fill="#ff9f91"/></marker>
  </defs>
  <rect width="1600" height="1000" rx="36" fill="#071722"/>
  <path d="M0 0h270v1000H0Z" fill="#101f29"/>
  <path d="M30 885l55-170 58 62 44-130 83 238Z" fill="#8ea8b2" opacity=".72"/>
  <text x="48" y="930" fill="#dbeaf0" font-family="system-ui, sans-serif" font-size="28" font-weight="800">INTERIOR</text>
  <path d="M1385 0h215v1000h-215Z" fill="url(#sea)" opacity=".86"/>
  <text x="1450" y="930" fill="#e2fbff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">MAR</text>
  <g stroke="#66818d" stroke-width="3" fill="#0b2634">
    <rect x="350" y="150" width="1000" height="750" rx="12"/>
    <path d="M550 150v750M750 150v750M950 150v750M1150 150v750M350 300h1000M350 450h1000M350 600h1000M350 750h1000"/>
  </g>
  <g fill="#dcebf1" font-family="ui-monospace, monospace" font-size="30" font-weight="800" text-anchor="middle">
    <text x="450" y="125">A</text><text x="650" y="125">B</text><text x="850" y="125">C</text><text x="1050" y="125">D</text><text x="1250" y="125">E</text>
    <text x="310" y="235">1</text><text x="310" y="385">2</text><text x="310" y="535">3</text><text x="310" y="685">4</text><text x="310" y="835">5</text>
  </g>
  <g transform="translate(165 42)" fill="#e8f8fc" font-family="system-ui, sans-serif" text-anchor="middle">
    <path d="M0 52V8M0 8l-13 22M0 8l13 22" stroke="#e8f8fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="91" font-size="24" font-weight="800">NORTE</text>
  </g>
  <g transform="translate(135 255)" font-family="system-ui, sans-serif">
    <rect x="-105" y="-35" width="210" height="92" rx="18" fill="#071722" stroke="#ff9f91" stroke-width="3"/>
    <circle cx="-72" cy="-4" r="22" fill="#071722" stroke="#ff9f91" stroke-width="4"/>
    <text x="-72" y="4" fill="#ffe2de" font-size="21" font-weight="900" text-anchor="middle">D</text>
    <text x="-43" y="-9" fill="#ffe2de" font-size="19" font-weight="900">RUTA D</text>
    <text x="-43" y="20" fill="#dbeaf0" font-size="17" font-weight="700">sale de B4</text>
  </g>
  <rect x="750" y="600" width="200" height="150" rx="16" fill="#7de2ff" fill-opacity=".08" stroke="#7de2ff" stroke-width="5" stroke-dasharray="12 10"/>
