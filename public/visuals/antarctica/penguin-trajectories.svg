    <circle r="30" fill="#f5f9fa" stroke="#071722" stroke-width="7"/>
    <path d="M-8-10c10-12 25-3 20 10-5 14-18 24-18 24S-20 7-8-10Z" fill="#071722"/>
    <path d="M0-48v-20" stroke="#c9ff24" stroke-width="5" stroke-linecap="round"/>
