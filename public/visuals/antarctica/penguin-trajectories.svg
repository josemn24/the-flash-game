    <g fill="#071722" stroke="#f4cb6b" stroke-width="4"><circle cx="455" cy="625" r="28"/></g><text x="455" y="634" fill="#fff0bc">A</text>
    <g fill="#071722" stroke="#7de2ff" stroke-width="4"><circle cx="615" cy="850" r="28"/></g><text x="615" y="859" fill="#dff9ff">B</text>
    <g fill="#071722" stroke="#e4a7ff" stroke-width="4"><circle cx="1080" cy="370" r="28"/></g><text x="1080" y="379" fill="#f5dcff">C</text>
    <g fill="#071722" stroke="#ff9f91" stroke-width="4"><circle cx="415" cy="838" r="28"/></g><text x="415" y="847" fill="#ffe2de">D</text>
  </g>
</svg>
