  <path d="M873 650L1105 337" fill="none" stroke="#e4a7ff" stroke-width="13" stroke-linecap="round" stroke-dasharray="2 24" marker-end="url(#arrowC)"/>
  <path d="M650 675L385 870" fill="none" stroke="#ff9f91" stroke-width="12" stroke-dasharray="42 17 8 17" marker-end="url(#arrowD)"/>
