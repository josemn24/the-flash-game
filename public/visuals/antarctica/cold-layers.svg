<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sistema de abrigo por capas</title>
  <desc id="desc">Una única silueta muestra una capa base seca junto a la piel, un espacio para completar la capa intermedia y una capa exterior cortavientos.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092737"/>
      <stop offset="1" stop-color="#06131d"/>
    </linearGradient>
    <pattern id="snow" width="86" height="86" patternUnits="userSpaceOnUse">
      <path d="M43 28v30M28 43h30M32 32l22 22M54 32L32 54" fill="none" stroke="#d9f5f7" stroke-opacity=".09" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" rx="56" fill="url(#night)"/>
  <rect x="26" y="26" width="1548" height="948" rx="42" fill="url(#snow)" stroke="#cceef2" stroke-width="4"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="800" y="105" fill="#f2fbfc" font-size="48" font-weight="900" text-anchor="middle">SISTEMA DE ABRIGO</text>
    <text x="800" y="158" fill="#b8d9df" font-size="28" font-weight="650" text-anchor="middle">Completa la capa intermedia antes de salir</text>
  </g>

  <!-- Una sola persona: las tres zonas se leen como capas concéntricas. -->
  <g transform="translate(55 195)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="35" y="20" width="760" height="700" rx="38" fill="#081d28" stroke="#547985" stroke-width="4"/>
    <text x="415" y="72" fill="#a9d6dc" font-size="25" font-weight="800" letter-spacing="4" text-anchor="middle">UNA PERSONA · TRES CAPAS</text>

    <circle cx="395" cy="205" r="70" fill="#173744" stroke="#a9d6dc" stroke-width="7"/>

    <!-- Capa exterior -->
    <path d="M145 650V455c0-137 112-220 250-220s250 83 250 220v195z" fill="#173e50" stroke="#d8f3f7" stroke-width="10"/>
    <path d="M395 242v400M254 315l141 122 141-122" fill="none" stroke="#8fb8c0" stroke-width="8"/>
    <path d="M190 470l-58-35M600 470l58-35" fill="none" stroke="#d8f3f7" stroke-width="10" stroke-linecap="round"/>

    <!-- Hueco de la capa intermedia -->
    <path d="M205 625V466c0-103 84-168 190-168s190 65 190 168v159" fill="none" stroke="#f8cc61" stroke-width="18" stroke-dasharray="27 17"/>

    <!-- Capa base junto a la piel -->
    <path d="M270 610V482c0-69 55-116 125-116s125 47 125 116v128z" fill="#668b96" stroke="#d8f3f7" stroke-width="8"/>
    <path d="M318 415c43 34 111 34 154 0" fill="none" stroke="#eaf6f7" stroke-width="9" stroke-linecap="round"/>

    <g font-family="ui-monospace, monospace" font-weight="900" text-anchor="middle">
      <circle cx="395" cy="535" r="34" fill="#eaf6f7"/>
      <text x="395" y="548" fill="#092737" font-size="36">1</text>

      <circle cx="552" cy="417" r="42" fill="#092737" stroke="#f8cc61" stroke-width="7" stroke-dasharray="12 8"/>
      <text x="552" y="430" fill="#f8cc61" font-size="40">?</text>

      <circle cx="615" cy="560" r="34" fill="#eaf6f7"/>
      <text x="615" y="573" fill="#092737" font-size="36">3</text>
    </g>
  </g>

  <!-- Leyenda conectada a la misma silueta, de dentro hacia fuera. -->
  <g transform="translate(885 245)" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" fill="#a9d6dc" font-size="25" font-weight="800" letter-spacing="4">DE DENTRO HACIA FUERA</text>

    <g transform="translate(0 72)">
      <circle cx="34" cy="34" r="34" fill="#eaf6f7"/>
      <text x="34" y="47" fill="#092737" font-family="ui-monospace, monospace" font-size="36" font-weight="900" text-anchor="middle">1</text>
      <text x="92" y="28" fill="#f2fbfc" font-size="34" font-weight="900">CAPA BASE</text>
      <text x="92" y="67" fill="#b8d9df" font-size="25" font-weight="650">seca · junto a la piel</text>
      <path d="M0 98h570" fill="none" stroke="#547985" stroke-width="3"/>
    </g>

    <g transform="translate(0 252)">
      <circle cx="34" cy="34" r="34" fill="#092737" stroke="#f8cc61" stroke-width="7" stroke-dasharray="12 8"/>
      <text x="34" y="47" fill="#f8cc61" font-family="ui-monospace, monospace" font-size="36" font-weight="900" text-anchor="middle">?</text>
      <text x="92" y="28" fill="#f8cc61" font-size="34" font-weight="900">CAPA INTERMEDIA</text>
      <text x="92" y="67" fill="#d7c78f" font-size="25" font-weight="650">por completar</text>
      <path d="M0 98h570" fill="none" stroke="#8c7b45" stroke-width="3" stroke-dasharray="12 9"/>
    </g>

    <g transform="translate(0 432)">
      <circle cx="34" cy="34" r="34" fill="#eaf6f7"/>
      <text x="34" y="47" fill="#092737" font-family="ui-monospace, monospace" font-size="36" font-weight="900" text-anchor="middle">3</text>
      <text x="92" y="28" fill="#f2fbfc" font-size="34" font-weight="900">EXTERIOR</text>
      <text x="92" y="67" fill="#b8d9df" font-size="25" font-weight="650">cortavientos</text>
    </g>
  </g>

</svg>
