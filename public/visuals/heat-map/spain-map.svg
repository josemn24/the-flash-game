<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Mapa esquemático de España</title>
  <desc id="desc">Silueta de España peninsular con Portugal y el mar como referencias, sin ciudades señaladas.</desc>
  <defs>
