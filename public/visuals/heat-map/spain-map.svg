      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e6ba"/>
      <stop offset="1" stop-color="#718665"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020609" flood-opacity="0.55"/>
