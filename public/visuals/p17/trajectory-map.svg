      <stop offset="1" stop-color="#8fa4a7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#294b55"/>
      <stop offset="1" stop-color="#102d36"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="40" fill="url(#ice)"/>
