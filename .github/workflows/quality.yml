name: quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_TELEMETRY: "false"
  FLASH_RUNTIME_SCOPE: pilot
  APP_ORIGIN: http://127.0.0.1:3000
  HEALTHCHECK_SECRET: ci-s22-health-secret

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Type architecture
        run: npm run type-architecture

      - name: Documentation links
        run: npm run docs:check

      - name: Style architecture
        run: npm run style-architecture

      - name: Unit tests
        run: npm test

      - name: PWA worker tests
        run: npm run test:pwa:worker

      - name: Lint
        run: npm run lint

  supabase:
    name: Supabase checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        run: npm run supabase:start

      - name: Schema revision
        run: npm run schema:revision:check

      - name: Schema tests
        run: npm run supabase:schema:test

      - name: Schema tests from migration history
        run: npm run supabase:schema:test -- --migrations

      - name: Schema reconciliation
        run: npm run supabase:schema:reconciliation:test

  browser:
    name: Browser scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Start Supabase
        run: npm run supabase:start

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA production scenarios
        env:
          PWA_E2E: "1"
          APP_ORIGIN: http://127.0.0.1:3001
        run: npm run test:e2e:raw -- e2e/pwa.spec.ts

      - name: Browser smoke scenarios
        run: >-
          npm run test:e2e --
          e2e/admin-portal.spec.ts
          e2e/s03-flash.spec.ts
          e2e/s04-recovery.spec.ts
          e2e/e01-mini-wordle.spec.ts
          e2e/e02-logic-code.spec.ts
          e2e/e03-progressive-clues.spec.ts
          e2e/e04-matching.spec.ts
          e2e/e05-queens.spec.ts
          e2e/e06-word-search.spec.ts
          e2e/f08-logic-matrix.spec.ts
          e2e/f16-zip.spec.ts
          e2e/f18-escape.spec.ts
          e2e/f19-word-hashtag.spec.ts

  quality:
    name: quality
    if: always()
    needs:
      - application
      - supabase
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all quality jobs
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$APPLICATION_RESULT" != "success" || \
                "$SUPABASE_RESULT" != "success" || \
                "$BROWSER_RESULT" != "success" ]]; then
            echo "::error::One or more quality jobs did not succeed."
            echo "Application: $APPLICATION_RESULT"
            echo "Supabase: $SUPABASE_RESULT"
            echo "Browser: $BROWSER_RESULT"
            exit 1
          fi
